- type: entity
  name: O'Connaburr, the Irelander
  parent: [BaseItem, BaseGrandTheftContraband]
  id: HosIreLander
  description: An antique copper greatsword, said to have once been wielded to end a great trouble.
  components:
  - type: Sprite
    sprite: _Omu/Objects/Weapons/Melee/irelander.rsi
    state: base
  - type: MeleeWeapon
    animationRotation: -135
    heavyStaminaCost: 15
    wideAnimationRotation: -135
    damage:
      types:
        Slash: 20
        Structural: 15
    soundHit:
      collection: MetalThud
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Slash: 10
        Structural: 40
  - type: MeleeThrowOnHit
    distance: 0.5
    speed: 10
  - type: Item
    size: Large
    storedRotation: 45
  - type: Clothing
    quickEquip: true
    slots:
    - back
    - suitstorage
  - type: UseDelay
    delay: 0.25
  - type: UndetectableContraband #Goobstation-Contraband detector
  - type: StealTarget
    stealGroup: WeaponSecHeadSword

- type: entity
  name: warden's rapier
  parent: [ BaseSword, BaseGrandTheftContraband ]
  id: WardenRapier
  description: A thin, elegant sword made for lunging over banana peels.
  components:
  - type: Sprite
    sprite: _Omu/Objects/Weapons/Melee/wardenrapier.rsi
  - type: MeleeWeapon
    angle: 0
    animationRotation: -90
    wideAnimationRotation: -90
    heavyStaminaCost: 2.5
    damage:
      types:
        Piercing: 20 # slightly more than the captain sabre but with less attack speed, idk how high this should really be
    soundHit:
        path: /Audio/Weapons/bladeslice.ogg
  - type: Item
    shape:
    - 0,0,0,3
    storedRotation: -45
  - type: MeleeDash
    emoteOnDash: null
    length: 2
    canDashWhileWeightless: false # Omu
  - type: UseDelay
    delay: 1.5
  - type: Tag
    tags:
    - WardenRapier
  - type: StealTarget
    stealGroup: WeaponEnergyShotgun
  - type: DisarmMalus
  - type: Reflect
    reflectProb: 0.3
    spread: 30

- type: entity
  name: The Wind of the Steppes
  parent: [BaseItem, BaseGrandTheftContraband]
  id: HosOniBlade
  description: As the winds of the highlands cut through the lands and wear them to dust, so too does our people's blade.
  components:
  - type: RestrictedMelee # Omu, its made for Oni, so only Oni can use it.
    whitelist:
      tags:
      - Oni
  - type: Sprite
    sprite: _Omu/Objects/Weapons/Melee/oniglaive.rsi
    state: base
  - type: Clothing
    quickEquip: true
    sprite: _Omu/Objects/Weapons/Melee/oniglaive.rsi
    slots:
    - Back
    - suitStorage
  - type: MeleeWeapon
    range: 2.5
    attackRate: 2.0
    animationRotation: -135
    heavyStaminaCost: 15
    wideAnimationRotation: -135
    damage:
      types:
        Slash: 10
        Structural: 15
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Slash: 10
  - type: Item
    size: Huge #should be ok at this size
    storedRotation: 45
  - type: DisarmMalus
    malus: 0.50 # maybe too much, also might not matter at because in melee range you die
  - type: Tool
    qualities:
    - Prying
    useSound:
      path: /Audio/Items/crowbar.ogg
  - type: Prying
    speedModifier: 1.50
  - type: UseDelay
    delay: 0.25
  - type: StealTarget
    stealGroup: WeaponSecHeadSword

- type: entity
  name: bloodsworn effigy
  parent: [BaseItem, BaseGrandTheftContraband]
  id: HoSBloodswornEffigy
  description: New layer 2 bell.
  components:
  - type: EmbeddableProjectile
    offset: -0.15,0.0
  - type: ThrowingAngle
    angle: 225
  - type: LandAtCursor
  - type: Tag
    tags:
    - Spear
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PolygonShape
          vertices:
            - -0.08,-0.06
            - -0.06,-0.08
            - 0.40,0.30
            - 0.30,0.40
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: Sharp
  - type: Sprite
    sprite: Objects/Weapons/Melee/spear.rsi
    layers:
    - state: spear
  - type: MeleeWeapon
    canWideSwing: false
    range: 2.2
    attackRate: 0.8
    animationRotation: -135
    wideAnimationRotation: -135
    damage:
      types:
        Piercing: 18
    angle: 0
    animation: WeaponArcThrust
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: DamageOtherOnHit
    damage:
      types:
        Piercing: 36
  - type: Item
    size: Large
    shape:
    - 0,0,8,0
    storedRotation: 45
  - type: Clothing
    quickEquip: false
    slots:
    - back
    - suitStorage
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Piercing: 6
  - type: ThrowableBlocked
  - type: RadiusBuff
    whitelist:
      components:
      - MindShield
    status: StatusEffectBloodsworn
  - type: ActivateBuffOnWield
  - type: StealTarget
    stealGroup: WeaponSecHeadSword